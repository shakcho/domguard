<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat Widget Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md flex flex-col h-[80vh]">
    <!-- Header -->
    <div class="px-4 py-2 border-b flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gray-800">Chat</h2>
      <span id="status" class="text-sm text-gray-500">Online</span>
    </div>

    <!-- Messages container -->
    <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar">
      <!-- Messages will be injected here -->
    </div>

    <!-- Composer -->
    <div class="border-t p-3 flex space-x-2">
      <input id="composerInput" type="text" placeholder="Type a message..."
        class="flex-1 border rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      <button id="sendBtn"
        class="bg-blue-600 text-white rounded-md px-4 py-2 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        Send
      </button>
    </div>
  </div>

  <script>
    // ==== Data & State ====
    const messagesContainer = document.getElementById('messagesContainer');
    const composerInput = document.getElementById('composerInput');
    const sendBtn = document.getElementById('sendBtn');

    let messageId = 0;
    let olderMessageCount = 0; // tracks how many older batches loaded

    // ==== Helper Functions ====
    function createMessageElement({ id, text, sender }) {
      const div = document.createElement('div');
      div.className = 'flex';
      div.dataset.id = id;

      const bubble = document.createElement('div');
      bubble.className = `max-w-xs px-4 py-2 rounded-lg ${
        sender === 'user' ? 'bg-blue-600 text-white ml-auto' : 'bg-gray-200 text-gray-800 mr-auto'
      }`;
      bubble.textContent = text;

      div.appendChild(bubble);
      return div;
    }

    function addMessage({ text, sender }, scrollToBottom = true) {
      const msgEl = createMessageElement({ id: ++messageId, text, sender });
      messagesContainer.appendChild(msgEl);
      if (scrollToBottom) {
        // Slight delay to ensure rendering
        setTimeout(() => {
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }, 0);
      }
    }

    function prependOlderMessages() {
      // Simulate loading 10 older messages
      const batchSize = 10;
      const fragment = document.createDocumentFragment();
      const previousHeight = messagesContainer.scrollHeight;

      for (let i = 0; i < batchSize; i++) {
        const idx = ++olderMessageCount;
        const text = `Older message #${idx}`;
        const msgEl = createMessageElement({ id: `old-${idx}`, text, sender: 'bot' });
        fragment.insertBefore(msgEl, fragment.firstChild);
      }

      messagesContainer.prepend(fragment);
      // Preserve scroll position after prepend
      const newHeight = messagesContainer.scrollHeight;
      messagesContainer.scrollTop = newHeight - previousHeight;
    }

    // ==== Event Listeners ====
    sendBtn.addEventListener('click', sendMessage);
    composerInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = composerInput.value.trim();
      if (!text) return;
      addMessage({ text, sender: 'user' });
      composerInput.value = '';
      // Mock bot response after delay
      setTimeout(() => {
        addMessage({ text: `Echo: ${text}`, sender: 'bot' });
      }, 1000);
    }

    // Lazy-load older messages when scrolled to top
    messagesContainer.addEventListener('scroll', () => {
      if (messagesContainer.scrollTop === 0) {
        prependOlderMessages();
      }
    });

    // ==== Initial Load ====
    // Load some initial messages
    for (let i = 1; i <= 15; i++) {
      addMessage({ text: `Welcome message ${i}`, sender: i % 2 === 0 ? 'bot' : 'user' }, false);
    }
    // Scroll to bottom after initial load
    setTimeout(() => {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 0);
  </script>
</body>
</html>
