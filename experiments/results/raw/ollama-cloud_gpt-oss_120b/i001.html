<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Social Activity Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center">
  <header class="w-full bg-white shadow py-4 mb-4">
    <h1 class="text-center text-2xl font-bold text-gray-800">Social Activity Feed</h1>
  </header>

  <main class="w-full max-w-2xl px-4 flex-1" id="feed">
    <!-- Posts will be injected here -->
  </main>

  <div id="loading" class="w-full flex justify-center py-6 hidden">
    <svg class="animate-spin h-8 w-8 text-gray-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
    </svg>
  </div>

  <script>
    // Mock data source
    let postCounter = 0;
    function fetchPosts(batchSize = 20) {
      return new Promise(resolve => {
        setTimeout(() => {
          const posts = [];
          for (let i = 0; i < batchSize; i++) {
            postCounter++;
            posts.push({
              id: postCounter,
              user: `User ${(postCounter % 10) + 1}`,
              avatar: `https://i.pravatar.cc/40?img=${(postCounter % 70) + 1}`,
              time: new Date().toLocaleString(),
              content: `This is the content of post #${postCounter}. Lorem ipsum dolor sit amet, consectetur adipiscing elit.`
            });
          }
          resolve(posts);
        }, 800); // simulate network latency
      });
    }

    // Render posts
    const feedEl = document.getElementById('feed');
    const loadingEl = document.getElementById('loading');
    let isLoading = false;

    function createPostCard(post) {
      const card = document.createElement('div');
      card.className = 'bg-white rounded-lg shadow mb-4 p-4';
      card.innerHTML = `
        <div class="flex items-center mb-2">
          <img src="${post.avatar}" alt="${post.user}" class="w-10 h-10 rounded-full mr-3">
          <div>
            <p class="font-semibold text-gray-800">${post.user}</p>
            <p class="text-xs text-gray-500">${post.time}</p>
          </div>
        </div>
        <p class="text-gray-700">${post.content}</p>
      `;
      return card;
    }

    async function loadMorePosts() {
      if (isLoading) return;
      isLoading = true;
      loadingEl.classList.remove('hidden');
      const posts = await fetchPosts();
      posts.forEach(p => feedEl.appendChild(createPostCard(p)));
      loadingEl.classList.add('hidden');
      isLoading = false;
    }

    // Initial load
    loadMorePosts();

    // Infinite scroll handler
    window.addEventListener('scroll', () => {
      const scrollPos = window.scrollY + window.innerHeight;
      const threshold = document.body.offsetHeight - 150;
      if (scrollPos >= threshold) {
        loadMorePosts();
      }
    });
  </script>
</body>
</html>
