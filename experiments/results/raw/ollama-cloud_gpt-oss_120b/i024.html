<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweet Composer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-md w-full mx-4 bg-white p-6 rounded-lg shadow-md">
    <textarea id="tweet" rows="1" placeholder="What's happening?" class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none overflow-hidden text-lg"></textarea>
    <div class="flex justify-between items-center mt-3">
      <span id="counter" class="text-gray-500 text-sm">0/280</span>
      <button id="postBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed">
        Post
      </button>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('tweet');
    const counter = document.getElementById('counter');
    const postBtn = document.getElementById('postBtn');
    const MAX = 280;
    const AMBER_THRESHOLD = 20; // characters remaining before amber

    function update() {
      const len = textarea.value.length;
      counter.textContent = `${len}/${MAX}`;

      // Update counter color and button state
      if (len > MAX) {
        counter.classList.remove('text-gray-500', 'text-amber-500');
        counter.classList.add('text-red-500');
        postBtn.disabled = true;
      } else if (len > MAX - AMBER_THRESHOLD) {
        counter.classList.remove('text-gray-500', 'text-red-500');
        counter.classList.add('text-amber-500');
        postBtn.disabled = false;
      } else {
        counter.classList.remove('text-amber-500', 'text-red-500');
        counter.classList.add('text-gray-500');
        postBtn.disabled = false;
      }

      // Auto‑grow textarea
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    }

    textarea.addEventListener('input', update);
    window.addEventListener('load', update);

    // Optional: simple post action
    postBtn.addEventListener('click', () => {
      if (!postBtn.disabled) {
        alert('Posted: ' + textarea.value);
        textarea.value = '';
        update();
      }
    });
  </script>
</body>
</html>
