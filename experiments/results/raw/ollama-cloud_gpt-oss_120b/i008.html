<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sortable Todo List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
    <h1 class="text-2xl font-bold mb-4 text-center">Todo List</h1>
    <form id="add-form" class="flex mb-4">
      <input id="new-item" type="text" placeholder="Add new todo"
        class="flex-1 border border-gray-300 rounded-l px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
        required>
      <button type="submit"
        class="bg-blue-500 text-white px-4 py-2 rounded-r hover:bg-blue-600 transition">
        Add
      </button>
    </form>
    <ul id="todo-list" class="space-y-2">
      <!-- Items will be injected here -->
    </ul>
  </div>

  <script>
    (function() {
      const list = document.getElementById('todo-list');
      const form = document.getElementById('add-form');
      const input = document.getElementById('new-item');
      const STORAGE_KEY = 'todoList';

      // Load saved items or default
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || ['Buy milk', 'Walk the dog', 'Read a book'];
      saved.forEach(text => addItem(text));

      // Add new item from form
      form.addEventListener('submit', e => {
        e.preventDefault();
        const text = input.value.trim();
        if (text) {
          addItem(text);
          input.value = '';
        }
      });

      // Delete button handling (event delegation)
      list.addEventListener('click', e => {
        if (e.target.classList.contains('delete-btn')) {
          e.target.closest('li').remove();
        }
      });

      // Drag & Drop logic
      let draggedItem = null;

      list.addEventListener('dragstart', e => {
        draggedItem = e.target.closest('li');
        e.dataTransfer.effectAllowed = 'move';
        // For visual feedback
        e.dataTransfer.setData('text/plain', '');
        setTimeout(() => draggedItem.classList.add('opacity-50'), 0);
      });

      list.addEventListener('dragend', () => {
        if (draggedItem) draggedItem.classList.remove('opacity-50');
        draggedItem = null;
      });

      list.addEventListener('dragover', e => {
        e.preventDefault();
        const target = e.target.closest('li');
        if (!target || target === draggedItem) return;

        const rect = target.getBoundingClientRect();
        const offset = e.clientY - rect.top;
        const before = offset < rect.height / 2;

        if (before) {
          list.insertBefore(draggedItem, target);
        } else {
          list.insertBefore(draggedItem, target.nextSibling);
        }
      });

      // MutationObserver to sync positions and persist
      const observer = new MutationObserver(() => {
        const items = Array.from(list.children);
        const data = items.map((li, idx) => {
          li.dataset.position = idx + 1;
          // Remove delete button text from saved data
          const text = li.cloneNode(true);
          const btn = text.querySelector('.delete-btn');
          if (btn) btn.remove();
          return text.textContent.trim();
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      });

      observer.observe(list, { childList: true });

      // Helper to create and append a list item
      function addItem(text) {
        const li = document.createElement('li');
        li.draggable = true;
        li.dataset.position = list.children.length + 1;
        li.className = 'bg-gray-50 border border-gray-200 rounded p-2 flex items-center cursor-move';
        li.innerHTML = `
          <span class="flex-1">${escapeHtml(text)}</span>
          <button type="button" class="delete-btn text-red-500 hover:text-red-700 ml-2">&times;</button>
        `;
        list.appendChild(li);
      }

      // Simple HTML escape
      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[tag]));
      }
    })();
  </script>
</body>
</html>
