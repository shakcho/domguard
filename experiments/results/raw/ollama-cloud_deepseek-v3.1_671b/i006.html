<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .highlight {
            background-color: #ffeb3b;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-8">
    <div class="w-full max-w-md mx-auto">
        <h1 class="text-3xl font-bold text-center mb-6 text-gray-800">Instant Search</h1>
        
        <div class="relative">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Type to search..." 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                autocomplete="off"
            />
            <div id="searchStatus" class="absolute right-3 top-3 text-gray-500 text-sm hidden">Searching...</div>
        </div>
        
        <ul id="resultsList" class="mt-4 bg-white rounded-lg shadow divide-y divide-gray-200 max-h-96 overflow-y-auto"></ul>
    </div>

    <script>
        // Mock search function - simulates async API call
        function mockSearch(query) {
            const mockData = [
                { id: 1, title: "JavaScript Tutorial", content: "Learn JavaScript fundamentals" },
                { id: 2, title: "React Guide", content: "Complete React developer guide" },
                { id: 3, title: "CSS Animations", content: "Beautiful CSS animations tutorial" },
                { id: 4, title: "Node.js Basics", content: "Introduction to Node.js programming" },
                { id: 5, title: "Vue.js Framework", content: "Vue.js complete reference guide" },
                { id: 6, title: "HTML5 Features", content: "Modern HTML5 features explained" },
                { id: 7, title: "TypeScript Introduction", content: "TypeScript for JavaScript developers" },
                { id: 8, title: "Web Performance", content: "Optimizing website performance techniques" }
            ];

            return new Promise((resolve) => {
                setTimeout(() => {
                    if (!query.trim()) {
                        resolve([]);
                        return;
                    }

                    const results = mockData.filter(item => 
                        item.title.toLowerCase().includes(query.toLowerCase()) || 
                        item.content.toLowerCase().includes(query.toLowerCase())
                    );
                    
                    resolve(results);
                }, 500); // Simulate network delay
            });
        }

        // Debounce function
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Highlight matching text
        function highlightText(text, query) {
            if (!query) return text;
            
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        // Render search results
        function renderResults(results, query) {
            const resultsList = document.getElementById('resultsList');
            
            if (results.length === 0) {
                resultsList.innerHTML = '<li class="p-4 text-gray-500 text-center">No results found</li>';
                return;
            }

            resultsList.innerHTML = results.map(item => `
                <li class="p-4 hover:bg-gray-50 cursor-pointer">
                    <div class="font-semibold text-gray-800">${highlightText(item.title, query)}</div>
                    <div class="text-gray-600 text-sm mt-1">${highlightText(item.content, query)}</div>
                </li>
            `).join('');
        }

        // Main search handler
        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const searchStatus = document.getElementById('searchStatus');
            
            searchStatus.classList.remove('hidden');
            
            const results = await mockSearch(query);
            
            searchStatus.classList.add('hidden');
            renderResults(results, query);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const debouncedSearch = debounce(handleSearch, 300);
            
            searchInput.addEventListener('input', debouncedSearch);
            
            // Initial empty state
            renderResults([], '');
        });
    </script>
</body>
</html>
