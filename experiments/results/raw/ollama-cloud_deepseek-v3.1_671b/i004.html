<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .preview-header {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <header id="previewHeader" class="preview-header w-full max-w-md bg-white shadow-md rounded-lg p-4 mb-6 flex items-center justify-between">
        <h1 class="text-xl font-bold text-gray-800" id="previewName">John Doe</h1>
        <span class="text-sm text-gray-600" id="previewTimezone">UTC</span>
    </header>

    <main class="w-full max-w-md bg-white shadow-md rounded-lg p-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Account Settings</h2>
        <form id="settingsForm" class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input type="text" id="name" name="name" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="John Doe">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="john.doe@example.com">
            </div>
            <div>
                <label class="flex items-center">
                    <input type="checkbox" id="emailNotifications" name="emailNotifications" class="rounded text-blue-600 focus:ring-blue-500" checked>
                    <span class="ml-2 text-sm text-gray-700">Email Notifications</span>
                </label>
            </div>
            <div>
                <label class="flex items-center">
                    <input type="checkbox" id="pushNotifications" name="pushNotifications" class="rounded text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700">Push Notifications</span>
                </label>
            </div>
            <div>
                <label for="timezone" class="block text-sm font-medium text-gray-700 mb-1">Timezone</label>
                <select id="timezone" name="timezone" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="UTC">UTC</option>
                    <option value="EST">Eastern Time (EST)</option>
                    <option value="PST">Pacific Time (PST)</option>
                    <option value="CET">Central European Time (CET)</option>
                </select>
            </div>
        </form>
        <div id="saveStatus" class="mt-4 text-sm text-gray-600"></div>
    </main>

    <script>
        function mockSaveSettings(settings) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    console.log('Settings saved:', settings);
                    resolve();
                }, 500);
            });
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        const form = document.getElementById('settingsForm');
        const saveStatus = document.getElementById('saveStatus');
        const previewHeader = document.getElementById('previewHeader');
        const previewName = document.getElementById('previewName');
        const previewTimezone = document.getElementById('previewTimezone');

        let currentSettings = {
            name: 'John Doe',
            email: 'john.doe@example.com',
            emailNotifications: true,
            pushNotifications: false,
            timezone: 'UTC'
        };

        const saveSettings = debounce(async (settings) => {
            saveStatus.textContent = 'Saving...';
            try {
                await mockSaveSettings(settings);
                saveStatus.textContent = 'Saved successfully!';
                setTimeout(() => { saveStatus.textContent = ''; }, 2000);
                
                const event = new CustomEvent('settings:changed', { detail: settings });
                document.dispatchEvent(event);
            } catch (error) {
                saveStatus.textContent = 'Error saving settings.';
                console.error('Save error:', error);
            }
        }, 800);

        form.addEventListener('input', (e) => {
            const formData = new FormData(form);
            const newSettings = {
                name: formData.get('name'),
                email: formData.get('email'),
                emailNotifications: formData.get('emailNotifications') === 'on',
                pushNotifications: formData.get('pushNotifications') === 'on',
                timezone: formData.get('timezone')
            };
            currentSettings = newSettings;
            saveSettings(newSettings);
        });

        document.addEventListener('settings:changed', (e) => {
            const settings = e.detail;
            previewName.textContent = settings.name;
            previewTimezone.textContent = settings.timezone;
            previewHeader.classList.add('bg-blue-50');
            setTimeout(() => previewHeader.classList.remove('bg-blue-50'), 1000);
        });
    </script>
</body>
</html>
