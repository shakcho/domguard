<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Data Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .table-container {
            overflow: auto;
            resize: both;
            min-width: 300px;
            min-height: 200px;
            max-width: 100%;
            max-height: 80vh;
            border: 1px solid #e2e8f0;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        th {
            background-color: #f7fafc;
            font-weight: 600;
        }
        .load-more {
            margin: 20px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-50 p-4">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Responsive Data Table</h1>
        
        <div id="tableContainer" class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Join Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be inserted here by JavaScript -->
                </tbody>
            </table>
        </div>

        <div class="load-more">
            <button id="loadMoreBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded">
                Load More Rows
            </button>
        </div>
    </div>

    <script>
        let allData = [];
        let visibleRowCount = 20;
        
        // Generate sample data
        function generateData(count) {
            const roles = ['Admin', 'User', 'Editor', 'Viewer'];
            const statuses = ['Active', 'Inactive', 'Pending'];
            const data = [];
            
            for (let i = 1; i <= count; i++) {
                data.push({
                    id: i,
                    name: `User ${i}`,
                    email: `user${i}@example.com`,
                    role: roles[i % roles.length],
                    status: statuses[i % statuses.length],
                    joinDate: new Date(Date.now() - Math.floor(Math.random() * 10000000000)).toLocaleDateString()
                });
            }
            return data;
        }

        // Render table rows
        function renderTableRows() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            
            const visibleData = allData.slice(0, visibleRowCount);
            
            visibleData.forEach(row => {
                const tr = document.createElement('tr');
                tr.classList.add('hover:bg-gray-50');
                tr.innerHTML = `
                    <td>${row.id}</td>
                    <td>${row.name}</td>
                    <td>${row.email}</td>
                    <td>${row.role}</td>
                    <td>${row.status}</td>
                    <td>${row.joinDate}</td>
                `;
                tableBody.appendChild(tr);
            });
            
            adjustColumnWidths();
        }

        // Adjust column widths based on container size
        function adjustColumnWidths() {
            const table = document.getElementById('dataTable');
            const container = document.getElementById('tableContainer');
            const headers = table.querySelectorAll('th');
            
            if (headers.length === 0) return;
            
            const containerWidth = container.clientWidth;
            const totalColumns = headers.length;
            const baseColumnWidth = Math.max(100, containerWidth / totalColumns);
            
            headers.forEach(header => {
                header.style.minWidth = `${baseColumnWidth}px`;
                header.style.maxWidth = `${baseColumnWidth * 2}px`;
            });
        }

        // Initialize data and render table
        function initTable() {
            allData = generateData(1000);
            renderTableRows();
            
            // Set up resize observer
            const resizeObserver = new ResizeObserver(entries => {
                for (let entry of entries) {
                    adjustColumnWidths();
                }
            });
            
            resizeObserver.observe(document.getElementById('tableContainer'));
            
            // Set up mutation observer for content changes
            const mutationObserver = new MutationObserver(mutations => {
                adjustColumnWidths();
            });
            
            mutationObserver.observe(document.getElementById('tableBody'), {
                childList: true,
                subtree: true
            });
            
            // Load more button event
            document.getElementById('loadMoreBtn').addEventListener('click', () => {
                visibleRowCount += 20;
                renderTableRows();
            });
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initTable);
    </script>
</body>
</html>
