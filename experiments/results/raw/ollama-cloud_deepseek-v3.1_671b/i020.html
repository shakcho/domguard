<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Markdown Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .split-pane {
            display: flex;
            flex-direction: row;
            height: 100vh;
        }
        .editor-pane, .preview-pane {
            flex: 1;
            overflow: auto;
            padding: 1rem;
        }
        textarea {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            font-family: monospace;
        }
        #preview {
            height: 100%;
            overflow: auto;
        }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #f8f9fa;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="split-pane">
        <div class="editor-pane bg-white border-r border-gray-200">
            <textarea id="editor" placeholder="Write your markdown here..." class="p-2"></textarea>
        </div>
        <div class="preview-pane bg-white">
            <div id="preview" class="prose max-w-none"></div>
        </div>
    </div>
    <div class="status-bar">
        <span id="word-count">Words: 0</span>
        <span id="char-count">Characters: 0</span>
        <span id="save-status" class="text-gray-500">Not saved</span>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const wordCountEl = document.getElementById('word-count');
        const charCountEl = document.getElementById('char-count');
        const saveStatusEl = document.getElementById('save-status');

        let saveTimeout = null;
        const DEBOUNCE_TIME = 1000;

        function updateCounts(text) {
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            wordCountEl.textContent = `Words: ${words}`;
            charCountEl.textContent = `Characters: ${chars}`;
        }

        function renderMarkdown(text) {
            // Simple markdown parsing
            let html = text
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/!\[(.*?)\]\((.*?)\)/gim, "<img alt='$1' src='$2' />")
                .replace(/\[(.*?)\]\((.*?)\)/gim, "<a href='$2'>$1</a>")
                .replace(/\n/gim, '<br>');
            preview.innerHTML = html || '<p class="text-gray-400">Preview will appear here...</p>';
        }

        function debounceSave() {
            saveStatusEl.textContent = 'Saving...';
            saveStatusEl.classList.remove('text-green-500', 'text-gray-500');
            saveStatusEl.classList.add('text-yellow-500');
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('markdownContent', editor.value);
                saveStatusEl.textContent = 'Saved';
                saveStatusEl.classList.remove('text-yellow-500', 'text-gray-500');
                saveStatusEl.classList.add('text-green-500');
                
                setTimeout(() => {
                    saveStatusEl.textContent = 'All changes saved';
                    saveStatusEl.classList.remove('text-green-500');
                    saveStatusEl.classList.add('text-gray-500');
                }, 2000);
            }, DEBOUNCE_TIME);
        }

        editor.addEventListener('input', (e) => {
            const text = e.target.value;
            updateCounts(text);
            renderMarkdown(text);
            debounceSave();
        });

        // Load saved content if exists
        const savedContent = localStorage.getItem('markdownContent');
        if (savedContent) {
            editor.value = savedContent;
            updateCounts(savedContent);
            renderMarkdown(savedContent);
            saveStatusEl.textContent = 'Loaded previous content';
            setTimeout(() => {
                saveStatusEl.textContent = 'All changes saved';
                saveStatusEl.classList.add('text-gray-500');
            }, 2000);
        }

        // Initial counts
        updateCounts(editor.value);
        renderMarkdown(editor.value);
    </script>
</body>
</html>
