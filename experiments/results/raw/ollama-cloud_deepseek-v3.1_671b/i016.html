<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container {
            scroll-behavior: smooth;
        }
        .loading-indicator {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md mx-auto bg-white rounded-lg shadow-lg overflow-hidden flex flex-col h-[600px]">
        <div class="p-4 border-b bg-indigo-600 text-white">
            <h1 class="text-lg font-semibold">Chat Support</h1>
        </div>
        
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4 chat-container">
            <div id="loading-indicator" class="loading-indicator text-center text-gray-500 py-2">
                Loading older messages...
            </div>
            <div id="messages-list" class="space-y-4">
                <div class="flex justify-start">
                    <div class="bg-gray-200 rounded-lg p-3 max-w-xs">
                        <p class="text-gray-800">Hello! How can I help you today?</p>
                        <span class="text-xs text-gray-500 block mt-1">Bot • Just now</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="p-4 border-t bg-white">
            <form id="message-form" class="flex space-x-2">
                <input 
                    id="message-input"
                    type="text" 
                    placeholder="Type your message..." 
                    class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    required
                >
                <button 
                    type="submit" 
                    class="bg-indigo-600 text-white rounded-lg px-4 py-2 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const messagesContainer = document.getElementById('messages-container');
            const messagesList = document.getElementById('messages-list');
            const messageForm = document.getElementById('message-form');
            const messageInput = document.getElementById('message-input');
            const loadingIndicator = document.getElementById('loading-indicator');
            
            let mockMessageId = 1;
            let isLoading = false;
            let hasMoreMessages = true;
            
            // Auto-scroll to bottom on new messages
            function scrollToBottom() {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            
            // Add a new message to the chat
            function addMessage(text, isUser = false, isOld = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
                
                const messageBubble = document.createElement('div');
                messageBubble.className = isUser ? 
                    'bg-indigo-600 text-white rounded-lg p-3 max-w-xs' : 
                    'bg-gray-200 rounded-lg p-3 max-w-xs';
                
                const messageText = document.createElement('p');
                messageText.textContent = text;
                messageBubble.appendChild(messageText);
                
                const timestamp = document.createElement('span');
                timestamp.className = 'text-xs block mt-1 ' + (isUser ? 'text-indigo-200' : 'text-gray-500');
                timestamp.textContent = isUser ? 'You • Just now' : 'Bot • Just now';
                messageBubble.appendChild(timestamp);
                
                messageDiv.appendChild(messageBubble);
                
                if (isOld) {
                    messagesList.insertBefore(messageDiv, messagesList.firstChild);
                } else {
                    messagesList.appendChild(messageDiv);
                    scrollToBottom();
                }
            }
            
            // Mock bot response
            function mockBotResponse(userMessage) {
                setTimeout(() => {
                    const responses = [
                        "I understand what you're saying.",
                        "That's interesting! Tell me more.",
                        "How can I assist you with that?",
                        "Thanks for sharing that information.",
                        "I'm here to help with any questions."
                    ];
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    addMessage(randomResponse, false);
                }, 1000);
            }
            
            // Load older messages
            function loadOlderMessages() {
                if (isLoading || !hasMoreMessages) return;
                
                isLoading = true;
                loadingIndicator.style.display = 'block';
                
                setTimeout(() => {
                    for (let i = 0; i < 3; i++) {
                        addMessage(`Older message #${mockMessageId++}`, Math.random() > 0.5, true);
                    }
                    
                    loadingIndicator.style.display = 'none';
                    isLoading = false;
                    
                    // Simulate no more messages after 15
                    if (mockMessageId > 15) {
                        hasMoreMessages = false;
                    }
                }, 1500);
            }
            
            // Handle form submission
            messageForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const messageText = messageInput.value.trim();
                if (messageText) {
                    addMessage(messageText, true);
                    messageInput.value = '';
                    mockBotResponse(messageText);
                }
            });
            
            // Lazy load older messages when scrolling to top
            messagesContainer.addEventListener('scroll', function() {
                if (messagesContainer.scrollTop === 0 && hasMoreMessages) {
                    loadOlderMessages();
                }
            });
            
            // Initial scroll to bottom
            scrollToBottom();
        });
    </script>
</body>
</html>
