<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Carousel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .carousel-slide {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .carousel-slide.active {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="relative w-full h-screen overflow-hidden">
        <div id="carousel-container" class="relative w-full h-full">
            <!-- Slide 1 -->
            <div class="carousel-slide active" data-index="0">
                <div class="w-full h-full bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');">
                    <div class="flex items-center justify-center h-full bg-black bg-opacity-50">
                        <div class="text-center text-white px-4">
                            <h1 class="text-4xl md:text-6xl font-bold mb-4">Beautiful Nature</h1>
                            <p class="text-xl md:text-2xl">Discover the wonders of the natural world</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Slide 2 -->
            <div class="carousel-slide" data-index="1">
                <div class="w-full h-full bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05');">
                    <div class="flex items-center justify-center h-full bg-black bg-opacity-50">
                        <div class="text-center text-white px-4">
                            <h1 class="text-4xl md:text-6xl font-bold mb-4">Mountain Views</h1>
                            <p class="text-xl md:text-2xl">Experience breathtaking landscapes</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Slide 3 -->
            <div class="carousel-slide" data-index="2">
                <div class="w-full h-full bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1418065460487-3e41a6c84dc5');">
                    <div class="flex items-center justify-center h-full bg-black bg-opacity-50">
                        <div class="text-center text-white px-4">
                            <h1 class="text-4xl md:text-6xl font-bold mb-4">Forest Adventures</h1>
                            <p class="text-xl md:text-2xl">Explore mysterious woodlands</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Slide 4 -->
            <div class="carousel-slide" data-index="3">
                <div class="w-full h-full bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba');">
                    <div class="flex items-center justify-center h-full bg-black bg-opacity-50">
                        <div class="text-center text-white px-4">
                            <h1 class="text-4xl md:text-6xl font-bold mb-4">Starry Nights</h1>
                            <p class="text-xl md:text-2xl">Gaze at the cosmic wonders above</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Slide 5 -->
            <div class="carousel-slide" data-index="4">
                <div class="w-full h-full bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');">
                    <div class="flex items-center justify-center h-full bg-black bg-opacity-50">
                        <div class="text-center text-white px-4">
                            <h1 class="text-4xl md:text-6xl font-bold mb-4">Ocean Depths</h1>
                            <p class="text-xl md:text-2xl">Dive into aquatic marvels</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Navigation buttons -->
        <button id="prev-btn" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-50 hover:bg-opacity-75 rounded-full p-2 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
        </button>
        
        <button id="next-btn" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-white bg-opacity-50 hover:bg-opacity-75 rounded-full p-2 focus:outline-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
        </button>
        
        <!-- Dot indicators -->
        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2">
            <button class="dot-indicator w-3 h-3 rounded-full bg-white bg-opacity-50 hover:bg-opacity-75 focus:outline-none active" data-index="0"></button>
            <button class="dot-indicator w-3 h-3 rounded-full bg-white bg-opacity-50 hover:bg-opacity-75 focus:outline-none" data-index="1"></button>
            <button class="dot-indicator w-3 h-3 rounded-full bg-white bg-opacity-50 hover:bg-opacity-75 focus:outline-none" data-index="2"></button>
            <button class="dot-indicator w-3 h-3 rounded-full bg-white bg-opacity-50 hover:bg-opacity-75 focus:outline-none" data-index="3"></button>
            <button class="dot-indicator w-3 h-3 rounded-full bg-white bg-opacity-50 hover:bg-opacity-75 focus:outline-none" data-index="4"></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const carousel = document.getElementById('carousel-container');
            const slides = carousel.querySelectorAll('.carousel-slide');
            const dots = document.querySelectorAll('.dot-indicator');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            
            let currentIndex = 0;
            let autoSlideInterval;
            
            // Initialize the carousel
            function initCarousel() {
                startAutoSlide();
                
                // Event listeners for navigation
                prevBtn.addEventListener('click', () => navigateToSlide(currentIndex - 1));
                nextBtn.addEventListener('click', () => navigateToSlide(currentIndex + 1));
                
                // Event listeners for dot indicators
                dots.forEach(dot => {
                    dot.addEventListener('click', () => {
                        const index = parseInt(dot.getAttribute('data-index'));
                        navigateToSlide(index);
                    });
                });
                
                // Pause on hover
                carousel.addEventListener('mouseenter', pauseAutoSlide);
                carousel.addEventListener('mouseleave', startAutoSlide);
            }
            
            // Navigate to a specific slide
            function navigateToSlide(index) {
                // Handle wrap-around
                if (index < 0) index = slides.length - 1;
                if (index >= slides.length) index = 0;
                
                // Update slides
                slides[currentIndex].classList.remove('active');
                slides[index].classList.add('active');
                
                // Update dots
                dots[currentIndex].classList.remove('active');
                dots[index].classList.add('active');
                
                currentIndex = index;
                
                // Restart auto-slide timer
                restartAutoSlide();
            }
            
            // Auto-advance slides
            function startAutoSlide() {
                autoSlideInterval = setInterval(() => {
                    navigateToSlide(currentIndex + 1);
                }, 3000);
            }
            
            // Pause auto-advancement
            function pauseAutoSlide() {
                clearInterval(autoSlideInterval);
            }
            
            // Restart auto-advancement
            function restartAutoSlide() {
                pauseAutoSlide();
                startAutoSlide();
            }
            
            // Initialize the carousel
            initCarousel();
        });
    </script>
</body>
</html>
