<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Invoice Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Invoice Builder</h1>

        <table class="w-full border-collapse">
            <thead>
                <tr class="bg-gray-200">
                    <th class="p-2 border">Description</th>
                    <th class="p-2 border">Quantity</th>
                    <th class="p-2 border">Unit Price</th>
                    <th class="p-2 border">Total</th>
                    <th class="p-2 border">Actions</th>
                </tr>
            </thead>
            <tbody id="invoice-items">
                <tr class="item-row">
                    <td class="p-2 border"><input type="text" class="w-full" value="Item 1"></td>
                    <td class="p-2 border"><input type="number" class="w-full" value="1" min="1"></td>
                    <td class="p-2 border"><input type="number" class="w-full" value="10.00" step="0.01" min="0"></td>
                    <td class="p-2 border"><span class="item-total">10.00</span></td>
                    <td class="p-2 border">
                        <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-2 rounded duplicate-button">Duplicate</button>
                        <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 rounded remove-button">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="mt-4">
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-1 px-2 rounded add-item-button">Add Item</button>
        </div>

        <div class="mt-4">
            <p>Subtotal: <span id="subtotal">10.00</span></p>
            <p>Tax (10%): <span id="tax">1.00</span></p>
            <p>Total: <span id="total">11.00</span></p>
        </div>
    </div>

    <script>
        const invoiceItems = document.getElementById('invoice-items');
        const subtotalSpan = document.getElementById('subtotal');
        const taxSpan = document.getElementById('tax');
        const totalSpan = document.getElementById('total');
        const addItemButton = document.querySelector('.add-item-button');

        let itemCount = 1;

        function calculateTotals() {
            let subtotal = 0;
            const itemRows = document.querySelectorAll('.item-row');

            itemRows.forEach(row => {
                const quantity = parseFloat(row.querySelectorAll('input')[1].value);
                const unitPrice = parseFloat(row.querySelectorAll('input')[2].value);
                const total = quantity * unitPrice;
                row.querySelector('.item-total').textContent = total.toFixed(2);
                subtotal += total;
            });

            subtotalSpan.textContent = subtotal.toFixed(2);
            const tax = subtotal * 0.10;
            taxSpan.textContent = tax.toFixed(2);
            const total = subtotal + tax;
            totalSpan.textContent = total.toFixed(2);
        }

        addItemButton.addEventListener('click', () => {
            itemCount++;
            const newRow = document.createElement('tr');
            newRow.classList.add('item-row');
            newRow.innerHTML = `
                <td class="p-2 border"><input type="text" class="w-full" value="Item ${itemCount}"></td>
                <td class="p-2 border"><input type="number" class="w-full" value="1" min="1"></td>
                <td class="p-2 border"><input type="number" class="w-full" value="10.00" step="0.01" min="0"></td>
                <td class="p-2 border"><span class="item-total">10.00</span></td>
                <td class="p-2 border">
                    <button class="bg-green-500 hover:bg-green-700 text-white font-bold py-1 px-2 rounded duplicate-button">Duplicate</button>
                    <button class="bg-red-500 hover:bg-red-700 text-white font-bold py-1 px-2 rounded remove-button">Remove</button>
                </td>
            `;

            invoiceItems.appendChild(newRow);
            calculateTotals();
        });

        invoiceItems.addEventListener('input', calculateTotals);

        invoiceItems.addEventListener('click', (event) => {
            if (event.target.classList.contains('remove-button')) {
                event.target.closest('.item-row').remove();
                calculateTotals();
            } else if (event.target.classList.contains('duplicate-button')) {
                const rowToDuplicate = event.target.closest('.item-row');
                const newRow = rowToDuplicate.cloneNode(true);
                invoiceItems.appendChild(newRow);
                calculateTotals();
            }
        });

        calculateTotals();
    </script>
</body>
</html>
