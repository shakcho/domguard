<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trusted By Marquee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .marquee-container {
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .marquee-content {
            display: flex;
            width: max-content;
        }
        .marquee-item {
            flex: none;
            margin: 0 2rem;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-8">
    <div class="w-full max-w-6xl">
        <h2 class="text-2xl md:text-3xl font-bold text-center text-gray-700 mb-12">
            Trusted by Industry Leaders
        </h2>
        
        <div class="marquee-container overflow-hidden">
            <div class="marquee-content" id="marquee">
                <!-- Logos will be duplicated by JS -->
                <div class="marquee-item">
                    <div class="bg-white p-6 rounded-xl shadow-sm flex items-center justify-center w-40 h-24">
                        <span class="text-2xl font-bold text-blue-600">LOGO</span>
                    </div>
                </div>
                <div class="marquee-item">
                    <div class="bg-white p-6 rounded-xl shadow-sm flex items-center justify-center w-40 h-24">
                        <span class="text-2xl font-bold text-green-600">BRAND</span>
                    </div>
                </div>
                <div class="marquee-item">
                    <div class="bg-white p-6 rounded-xl shadow-sm flex items-center justify-center w-40 h-24">
                        <span class="text-2xl font-bold text-purple-600">COMPANY</span>
                    </div>
                </div>
                <div class="marquee-item">
                    <div class="bg-white p-6 rounded-xl shadow-sm flex items-center justify-center w-40 h-24">
                        <span class="text-2xl font-bold text-red-600">ENTERPRISE</span>
                    </div>
                </div>
                <div class="marquee-item">
                    <div class="bg-white p-6 rounded-xl shadow-sm flex items-center justify-center w-40 h-24">
                        <span class="text-2xl font-bold text-yellow-600">CORP</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const marquee = document.getElementById('marquee');
            const content = marquee.innerHTML;
            
            // Duplicate content to ensure seamless looping
            marquee.innerHTML = content + content;
            
            const items = marquee.querySelectorAll('.marquee-item');
            let position = 0;
            let speed = 0.5;
            let isPaused = false;
            let animationId;
            
            // Set initial position
            marquee.style.transform = `translateX(${position}px)`;
            
            function animate() {
                if (!isPaused) {
                    position -= speed;
                    
                    // Reset position when we've scrolled past the first set
                    if (Math.abs(position) >= marquee.scrollWidth / 2) {
                        position = 0;
                    }
                    
                    marquee.style.transform = `translateX(${position}px)`;
                }
                
                animationId = requestAnimationFrame(animate);
            }
            
            // Pause on hover
            marquee.addEventListener('mouseenter', () => {
                isPaused = true;
            });
            
            marquee.addEventListener('mouseleave', () => {
                isPaused = false;
            });
            
            // Start animation
            animate();
        });
    </script>
</body>
</html>
