<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Carousel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .slide {
            transition: opacity 0.5s ease-in-out;
        }
        .dot-active {
            background-color: #4F46E5;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="relative max-w-6xl mx-auto mt-10 rounded-xl overflow-hidden shadow-xl">
        <!-- Carousel Container -->
        <div class="relative h-96 md:h-[500px]">
            <!-- Slides -->
            <div id="slide1" class="slide absolute inset-0 opacity-100 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb')"></div>
            <div id="slide2" class="slide absolute inset-0 opacity-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05')"></div>
            <div id="slide3" class="slide absolute inset-0 opacity-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1469474968028-56623f02e42e')"></div>
            <div id="slide4" class="slide absolute inset-0 opacity-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470')"></div>
            <div id="slide5" class="slide absolute inset-0 opacity-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e')"></div>
            
            <!-- Overlay -->
            <div class="absolute inset-0 bg-black bg-opacity-40"></div>
            
            <!-- Content -->
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center text-white px-4">
                <h1 class="text-4xl md:text-6xl font-bold mb-4">Discover Amazing Places</h1>
                <p class="text-xl md:text-2xl mb-8 max-w-2xl">Experience the beauty of nature with our curated collection of breathtaking landscapes</p>
                <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full text-lg transition duration-300">
                    Explore Now
                </button>
            </div>
            
            <!-- Navigation Arrows -->
            <button id="prevBtn" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 hover:bg-opacity-75 text-white p-3 rounded-full transition duration-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <button id="nextBtn" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 hover:bg-opacity-75 text-white p-3 rounded-full transition duration-300">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>
        
        <!-- Dot Indicators -->
        <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex space-x-3">
            <button class="dot dot-active w-3 h-3 rounded-full bg-white bg-opacity-50"></button>
            <button class="dot w-3 h-3 rounded-full bg-white bg-opacity-50"></button>
            <button class="dot w-3 h-3 rounded-full bg-white bg-opacity-50"></button>
            <button class="dot w-3 h-3 rounded-full bg-white bg-opacity-50"></button>
            <button class="dot w-3 h-3 rounded-full bg-white bg-opacity-50"></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const slides = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            let currentIndex = 0;
            let slideInterval;
            const intervalTime = 3000;
            
            // Show slide by index
            function showSlide(index) {
                slides.forEach(slide => slide.classList.add('opacity-0'));
                slides[index].classList.remove('opacity-0');
                
                dots.forEach(dot => dot.classList.remove('dot-active'));
                dots[index].classList.add('dot-active');
                
                currentIndex = index;
            }
            
            // Next slide
            function nextSlide() {
                const nextIndex = (currentIndex + 1) % slides.length;
                showSlide(nextIndex);
                resetInterval();
            }
            
            // Previous slide
            function prevSlide() {
                const prevIndex = (currentIndex - 1 + slides.length) % slides.length;
                showSlide(prevIndex);
                resetInterval();
            }
            
            // Start auto-advance
            function startInterval() {
                slideInterval = setInterval(nextSlide, intervalTime);
            }
            
            // Reset interval
            function resetInterval() {
                clearInterval(slideInterval);
                startInterval();
            }
            
            // Event listeners
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            
            dots.forEach((dot, index) => {
                dot.addEventListener('click', () => {
                    showSlide(index);
                    resetInterval();
                });
            });
            
            // Pause on hover
            const carousel = document.querySelector('.relative');
            carousel.addEventListener('mouseenter', () => clearInterval(slideInterval));
            carousel.addEventListener('mouseleave', startInterval);
            
            // Initialize
            startInterval();
        });
    </script>
</body>
</html>
