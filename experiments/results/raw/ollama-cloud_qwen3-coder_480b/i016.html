<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-list {
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            height: 400px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 18px;
        }
        .user-message {
            align-self: flex-end;
            background-color: #3b82f6;
            color: white;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #e5e7eb;
            color: black;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg flex flex-col">
        <div id="message-list" class="message-list p-4">
            <!-- Messages will be inserted here -->
        </div>
        <div class="border-t p-4">
            <div class="flex">
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Type a message..." 
                    class="flex-1 border rounded-l-lg p-2 focus:outline-none"
                >
                <button 
                    id="send-button" 
                    class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600 transition"
                >
                    Send
                </button>
            </div>
        </div>
    </div>

    <script>
        const messageList = document.getElementById('message-list');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        
        let messages = [];
        let isLoading = false;
        let page = 1;
        const messagesPerPage = 10;
        
        // Initial messages
        for (let i = 1; i <= 5; i++) {
            messages.push({
                id: i,
                text: `Initial message ${i}`,
                sender: i % 2 === 0 ? 'user' : 'bot',
                timestamp: new Date(Date.now() - (5 - i) * 60000)
            });
        }
        
        function renderMessages() {
            messageList.innerHTML = '';
            
            messages.forEach(msg => {
                const messageElement = document.createElement('div');
                messageElement.className = `message ${msg.sender === 'user' ? 'user-message' : 'bot-message'}`;
                messageElement.textContent = msg.text;
                messageList.appendChild(messageElement);
            });
            
            scrollToBottom();
        }
        
        function scrollToBottom() {
            messageList.scrollTop = messageList.scrollHeight;
        }
        
        function scrollToTop() {
            messageList.scrollTop = 0;
        }
        
        function addMessage(text, sender) {
            const newMessage = {
                id: messages.length + 1,
                text: text,
                sender: sender,
                timestamp: new Date()
            };
            
            messages.push(newMessage);
            renderMessages();
        }
        
        function loadMoreMessages() {
            if (isLoading) return;
            
            isLoading = true;
            
            // Simulate API call delay
            setTimeout(() => {
                const startIndex = page * messagesPerPage;
                const endIndex = startIndex + messagesPerPage;
                
                // Generate older messages
                const olderMessages = [];
                for (let i = startIndex; i < endIndex; i++) {
                    olderMessages.unshift({
                        id: -i,
                        text: `Older message ${i}`,
                        sender: i % 2 === 0 ? 'user' : 'bot',
                        timestamp: new Date(Date.now() - (i + 10) * 60000)
                    });
                }
                
                messages = [...olderMessages, ...messages];
                renderMessages();
                
                page++;
                isLoading = false;
            }, 1000);
        }
        
        function handleSendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                addMessage(text, 'user');
                messageInput.value = '';
                
                // Simulate bot response after delay
                setTimeout(() => {
                    addMessage(`Echo: ${text}`, 'bot');
                }, 1000);
            }
        }
        
        // Event listeners
        sendButton.addEventListener('click', handleSendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
        
        messageList.addEventListener('scroll', () => {
            if (messageList.scrollTop === 0) {
                loadMoreMessages();
            }
        });
        
        // Initial render
        renderMessages();
    </script>
</body>
</html>
